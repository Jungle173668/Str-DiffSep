seed: 64736289
name: default
train: true
test: false
path:
  exp_root: exp
  datasets:
    wsj0_mix: /datasets/wsj0-2mix  # change to your path
    LibriMix: /datasets/LibriMix  # change to your path
    # LibriMix: /data/milsrg1/corpora/LibriMix
  figures: figures
datamodule:
  train:
    dl_opts:
      num_workers: 8
      shuffle: true
      batch_size: 6
    dataset:
      _target_: datasets.WSJ0_mix
      path: ${path.datasets.wsj0_mix}
      n_spkr: ${model.n_speakers}
      fs: ${model.fs}
      cut: max
      split: train
      max_len_s: 5
      max_n_samples: null
      subset_ratio: 1
  val:
    dl_opts:
      num_workers: 8
      shuffle: false
      batch_size: 5
    dataset:
      _target_: datasets.WSJ0_mix
      path: ${path.datasets.wsj0_mix}
      n_spkr: ${model.n_speakers}
      fs: ${model.fs}
      cut: max
      split: val
      max_len_s: null
      max_n_samples: null
      subset_ratio: 1
  test:
    dl_opts:
      num_workers: 8
      shuffle: false
      batch_size: 5
    dataset:
      _target_: datasets.WSJ0_mix
      path: ${path.datasets.wsj0_mix}
      n_spkr: ${model.n_speakers}
      fs: ${model.fs}
      cut: max
      split: test
      max_len_s: null
      max_n_samples: null
      subset_ratio: 0.1
  libri-clean:
    dl_opts:
      num_workers: 8
      shuffle: false
      batch_size: 16
    dataset:
      _target_: datasets.LibriMix
      path: ${path.datasets.LibriMix}
      n_spkr: ${model.n_speakers}
      fs: ${model.fs}
      cut: max
      split: libri2mix_test
      max_len_s: null
      max_n_samples: null
      mix_dir: mix_clean
      subset_ratio: 1
  libri-noisy:
    dl_opts:
      num_workers: 8
      shuffle: false
      batch_size: 16
    dataset:
      _target_: datasets.LibriMix
      path: ${path.datasets.LibriMix}
      n_spkr: ${model.n_speakers}
      fs: ${model.fs}
      cut: max
      split: libri2mix_test
      max_len_s: null
      max_n_samples: null
      mix_dir: mix_both
      subset_ratio: 1
model:
  n_speakers: 2
  fs: 8000
  t_eps: 0.03
  t_rev_init: 0.03
  ema_decay: 0.999
  valid_max_sep_batches: 75
  time_sampling_strategy: uniform
  train_source_order: power
  init_hack: 6
  init_hack_p: 0.7
  mmnr_thresh_pit: 13.0
  score_model:
    _target_: model_SkiM_D.score_models_skim.ScoreModelSkiM
    backbone_args:
      _target_: model_SkiM_D.SkiMDiff.SkiMDiff
      num_sources: ${model.n_speakers}
      hidden_size: 256
      num_blocks: 8
      segment_size: 50
      seg_overlap: true
      bidirectional: false
      kernel_size: 16
      stride: 8
      des: false
      use_history: false
  sde:
    _target_: sdes.sdes.MixSDE
    ndim: ${model.n_speakers}
    d_lambda: 2.0
    sigma_min: 0.05
    sigma_max: 0.5
    'N': 30
  sampler:
    'N': 30
    snr: 0.5
    corrector_steps: 1
  loss:
    _target_: torch.nn.MSELoss
  main_val_loss: val/si_sdr
  main_val_loss_mode: max
  val_losses:
    val/si_sdr:
      _target_: model_SkiM_D.losses.SISDRLoss
      zero_mean: true
      clamp_db: 30
      reduction: mean
      sign_flip: true
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0002
    weight_decay: 0.0
  scheduler: null
  grad_clipper:
    _target_: utils.FixedClipper
    max_norm: 5.0
trainer:
  _target_: pytorch_lightning.Trainer
  accumulate_grad_batches: 1
  min_epochs: 1
  max_epochs: 1000
  deterministic: true
  accelerator: gpu
  devices: -1
  strategy: ddp
  check_val_every_n_epoch: 10
  default_root_dir: .
  profiler: false
